version: 2
updates:
  - package-ecosystem: nuget
    directory: /src/microservices/KYC
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      testing:
        patterns: ["xunit*", "NSubstitute*", "Testcontainers*", "coverlet*"]
  - package-ecosystem: docker
    directory: /src/microservices/KYC
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
